; IB3Pad 0.6 settings. Lines starting with ; are comments.
;
; Every button below is mapped to one of the GAME'S OWN COMMANDS, called directly inside the game
; (the same functions the port's keybinds call), never through a keyboard key or a key binding, so
; the controller keeps working whatever keyboard bindings you set in the launcher.
; Game actions: DodgeLeft, DodgeRight, Block, Super, Magic, Magic1, Magic2, Magic3, AutoStab,
;            ClashMash, Pause, Exit, FastForward, BossInfo, PopupOK, ScrollUp, ScrollDown,
;            ScrollLeft, ScrollRight, SwipeUp, SwipeDown, SwipeLeft, SwipeRight (and the diagonals
;            SwipeUpLeft, SwipeUpRight, SwipeLeftUp, SwipeLeftDown, SwipeDownLeft, SwipeDownRight,
;            SwipeRightUp, SwipeRightDown), LeftClick, RightClick, None
; Plain keyboard keys (A-Z, 0-9, F1-F12, Space, Enter...) still work for custom setups, but then
; follow your keyboard bindings.
; Join up to three with + to send them together, for example AutoStab+PopupOK.
; Buttons:   A B X Y LB RB LT RT Start Back L3 R3 DPadUp DPadDown DPadLeft DPadRight

[General]
; -1 = first controller found, 0-3 = a specific controller
PadIndex=-1
; 0 = hide the controller from the game itself so nothing fires twice (recommended)
PassThroughToGame=0
; 1 = keep the mouse cursor inside the game window while the game has focus (released on alt-tab)
ConfineCursor=1
; Clicking both sticks together (L3+R3): opens the game's quit prompt
L3R3Together=Exit
; One layout works everywhere. Advanced: set ModeToggleButton (for example R3) to switch to the
; [Menu] layout below; StartMode picks which layout is active at launch (Fight or Menu).
StartMode=Fight
ModeToggleButton=None
AutoMode=0
ModeRumble=1
; How far a trigger must be pulled to count as pressed (0-255); it releases below half of this
TriggerThreshold=64
; Write ib3pad.log next to this file (attach it to bug reports)
Log=1
; 1 = also log every controller button press (for troubleshooting only; leave at 0)
DebugInput=0

[Fight]
; The game adapts these three to your weapon: sword and shield = dodge/block/dodge,
; heavy = block left/centre/right, dual = dodge/centre dodge/dodge
X=DodgeLeft
; Block in fights, select (click) in menus
A=Block+LeftClick
B=DodgeRight
; Auto-stab in fights, confirm popups outside them
Y=AutoStab+PopupOK
; Magic: tap RT to open magic mode; hold RT and press X/Y/B to cast slot 1/2/3 directly
RT=Magic
LT=Super
RB=ClashMash
; Click; hold and move the right stick to drag-scroll lists
LB=LeftClick
R3=LeftClick
; Pause in fights, back in menus
Start=Pause
; Hold to fast-forward cutscenes
Back=FastForward
L3=BossInfo
; D-pad scrolls menus and slashes in fights (the game ignores each where it does not apply)
DPadUp=ScrollUp+SwipeUp
DPadDown=ScrollDown+SwipeDown
DPadLeft=ScrollLeft+SwipeLeft
DPadRight=ScrollRight+SwipeRight
; While this button is held, the [FightMagicLayer] keys replace the face buttons
MagicLayerButton=RT
; 1 = the layer button's own action fires when it is released without a combo (prevents double magic)
MagicLayerTapOnRelease=1

[FightMagicLayer]
; Cast magic slots 1-3 while holding the magic button
X=Magic1
Y=Magic2
B=Magic3

[Menu]
; Back: in any menu this button presses that screen's own on-screen back arrow, going back
; exactly one layer (popups without an arrow close with their own Close/No). Outside menus it
; does its normal [Fight] action.
BackButton=B
; The keys below are used only if ModeToggleButton is set.
A=LeftClick
B=Pause
Y=PopupOK
X=None
Start=Pause
Back=FastForward

[Slash]
; Keys = instant slashes: each of the 12 slash directions calls the game's own slash command
;        directly (no keys involved, nothing to set up).
; Mouse = emulate a touch swipe instead (slower; use only if Keys does not work for you).
Mode=Keys
TempBindings=1
; Left stick: how far to push for a slash (0-1) and how far to return before the next one
FlickThreshold=0.65
ResetThreshold=0.35
; Swinging the stick to a new direction this many degrees away slashes again without returning
; to the centre, for fast combos (0 = off)
RollAngle=75
; 1 = D-pad fires slashes as mouse swipes instead of using the [Fight] D-pad keys above
DPadSlashes=0
; Mouse mode only: swipe shape and speed
Snap=0
SwipeLength=25
SwipeOriginX=50
SwipeOriginY=50
SwipeSteps=4
SwipeStepMs=8
RestoreCursor=1

[Focus]
; Controller menus (0.6). A is always a plain click where the cursor is, except: Items / Supplies
; (A buys, equips or uses) and the Gem Bag (A picks a gem up / drops it). Nothing moves the cursor
; on its own except Items / Supplies parking it on BUY / EQUIP / USE. X snaps the outline and cursor
; to the nearest button. R3 stays a click you can hold (e.g. to turn the character model).
;  Hub (Siris / Isa): D-pad moves between Items, Supplies, Skills, Customize, Goals and the gear;
;    LB or RB switches Siris / Isa; Y opens the gear menu.
;  Items: D-pad up/down scrolls items, left/right changes item type; A buys / equips;
;    LB / RB = ALL / INVENTORY / STORE; LT = items, RT = Gem Bag.
;  Gem Bag: D-pad moves over the gem grid and the item's sockets; A picks a gem up, A again drops
;    it; B while holding puts it back; Y sells it; LT = back to items.
;  Supplies: D-pad scrolls; A uses; Y buys.
;  Skills: up/down picks a stat row (on its number), left/right walks its skills; A clicks;
;    Y (or Start) accepts the points, B cancels them, X resets all points; LB / RB = Skills / Stats.
;  Goals: up/down moves row to row with the cursor on COLLECT (scrolls at the ends); A collects.
;  Customize: D-pad moves through the side bar and its sub-menu rows (scrolling the sub-menu).
;  Blacksmith: D-pad up/down steps through the items, left/right changes item type; A = UPGRADE
;    (the cursor sits on it); LB / RB = Siris / Isa.
;  Forge / Fusion / Cauldron progress: D-pad moves between each slot row and its FINISH NOW
;    (scrolling at the ends); A clicks.
;  Cauldron / Fusion Chamber: D-pad moves over the cells; A on an ingredient / gem puts it straight
;    into the next empty cauldron / fusion slot (A on a filled slot takes it back out); Y = COOK /
;    FUSE; X = the cauldron's cancel / take the last gem out of fusion.
;  Question popups, fight results, the open gear menu: D-pad moves the outline; Start = Yes / OK.
; Every other screen (including reward pop-ups while exploring) keeps the 0.5 controls.
; View opens the ? help on screens that have one.
Enabled=1
Outline=1
; outline colour as RRGGBB
OutlineColor=E6C35A
; Items / Supplies: park the cursor on BUY / EQUIP / USE when the screen opens
AutoFocus=1
LeftStick=1
RepeatDelayMs=300
RepeatMs=130
; write every screen's buttons to ib3pad.log when it opens (also on with DebugInput=1)
LogScreens=0

[Navigation]
; IB3Pad reads which screen the game is on (fight or not) straight from the game's memory
; (read-only). In fights the left stick fires instant slashes; everywhere else it does the
; original click-and-drag swipe, which turns the camera quickly while exploring.
ReadGameState=1
LeftStickSwipe=1
SwipeSteps=8
SwipeStepMs=10
; While exploring, this button swings the camera back to centre (the game's own camera
; glides there). Set to None to keep the button's [Fight] action instead.
RecenterCameraButton=R3

[Camera]
; Invert mouse-look while the mod is installed (the right stick moves the mouse).
; Applied to the game's input settings at launch and put back when the game exits,
; so removing the mod leaves your settings exactly as they were.
InvertX=1
InvertY=1

[Cursor]
; Right stick moves the mouse like a real mouse: camera while exploring, cursor in menus.
; Speed is pixels per second at full tilt on a 1080p screen.
Speed=1600
Deadzone=0.20
Curve=2.0
InFight=1
; 1 = the left stick also moves the mouse like the right stick (off: it swipes instead, see [Navigation])
LeftStickLook=0
LeftStickSpeed=1600

[Scroll]
; Menu layout only (when ModeToggleButton is set): left stick and D-pad scroll lists
LeftStick=1
DPad=1
RepeatMs=90
